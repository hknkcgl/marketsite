name: Build Cross-Platform Desktop Apps (Windows & macOS)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build macOS App
        run: |
          cd admin_app
          flutter pub get
          flutter build macos --release
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YildirimlarManav-macOS
          path: admin_app/build/macos/Build/Products/Release/admin_app.app

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build Windows App
        run: |
          cd admin_app
          flutter pub get
          flutter build windows --release
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YildirimlarManav-Windows
          path: admin_app/build/windows/x64/runner/Release/
